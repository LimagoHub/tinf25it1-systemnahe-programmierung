  <line x1="705" y1="110" x2="684" y2="110" stroke="#c00" stroke-width="2" marker-end="url(#a)"/><text x="709" y="114" fill="#c00" font-size="12">SP</text>
  <text x="360" y="352" text-anchor="middle" fill="#555" font-size="12">Der Stack wächst von oben (hohe Adresse) nach unten. Beim return wird nur der Stackpointer (SP) zurückgesetzt.</text>
