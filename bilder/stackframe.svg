  <text x="110" y="220" text-anchor="middle" fill="#777">frei</text>
  <line x1="205" y1="110" x2="184" y2="110" stroke="#c00" stroke-width="2" marker-end="url(#a)"/><text x="209" y="114" fill="#c00" font-size="12">SP</text>
  <!-- Spalte 2 -->
  <text x="360" y="24" text-anchor="middle" font-weight="bold">2. Aufruf verdoppeln(x)</text>
