  <!-- Spalte 3 -->
  <text x="610" y="24" text-anchor="middle" font-weight="bold">3. nach dem return</text>
  <rect x="540" y="40" width="140" height="70" fill="#cfe3f7" stroke="#333" stroke-width="2"/>
  <text x="610" y="70" text-anchor="middle" font-weight="bold">Stackframe</text>
  <text x="610" y="88" text-anchor="middle" font-weight="bold">main</text>
