  <text x="360" y="70" text-anchor="middle" font-weight="bold">Stackframe</text>
  <text x="360" y="88" text-anchor="middle" font-weight="bold">main</text>
  <rect x="290" y="110" width="140" height="140" fill="#fde9c4" stroke="#333" stroke-width="2"/>
  <line x1="290" y1="145" x2="430" y2="145" stroke="#999"/><line x1="290" y1="180" x2="430" y2="180" stroke="#999"/><line x1="290" y1="215" x2="430" y2="215" stroke="#999"/>
  <text x="360" y="132" text-anchor="middle">Parameter x</text>
  <text x="360" y="167" text-anchor="middle">Rücksprungadresse</text>
  <text x="360" y="202" text-anchor="middle">gesicherte Register</text>
  <text x="360" y="237" text-anchor="middle">lokal: ergebnis</text>
  <path d="M282,110 h-8 v140 h8" fill="none" stroke="#333"/>
  <text x="268" y="176" text-anchor="end" font-size="12">Stackframe</text><text x="268" y="192" text-anchor="end" font-size="12">verdoppeln</text>
