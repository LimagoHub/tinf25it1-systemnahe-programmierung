<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00"/></marker></defs>
  <!-- Spalte 1 -->
  <text x="110" y="24" text-anchor="middle" font-weight="bold">1. main läuft</text>
  <rect x="40" y="40" width="140" height="70" fill="#cfe3f7" stroke="#333" stroke-width="2"/>
