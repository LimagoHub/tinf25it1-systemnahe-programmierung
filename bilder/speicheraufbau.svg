<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00"/></marker>
  <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#ccc" stroke-width="2"/></pattern></defs>
  <text x="20" y="28" fill="#555">hohe Adresse</text>
  <text x="20" y="418" fill="#555">Adresse 0</text>
  <!-- column -->
  <rect x="140" y="40" width="200" height="80" fill="#cfe3f7" stroke="#333" stroke-width="2"/>
  <text x="240" y="75" text-anchor="middle" font-weight="bold">Stack</text>
  <text x="240" y="97" text-anchor="middle" font-size="12">wächst nach unten</text>
  <line x1="240" y1="124" x2="240" y2="168" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <rect x="140" y="120" width="200" height="120" fill="url(#h)" stroke="#333" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="240" y="186" text-anchor="middle" font-weight="bold">freier Speicher</text>
  <text x="240" y="206" text-anchor="middle" font-size="12">(Heap)</text>
    <rect x="140" y="240" width="200" height="80" fill="#fde9c4" stroke="#333" stroke-width="2"/>
  <text x="240" y="275" text-anchor="middle" font-weight="bold">Datensegment</text>
  <text x="240" y="297" text-anchor="middle" font-size="12">globale + static-Variablen</text>
  <rect x="140" y="330" width="200" height="80" fill="#d9ead3" stroke="#333" stroke-width="2"/>
  <text x="240" y="365" text-anchor="middle" font-weight="bold">Codesegment</text>
  <text x="240" y="387" text-anchor="middle" font-size="12">Programm + Konstanten</text>
  <!-- SP -->
  <line x1="20" y1="120" x2="132" y2="120" stroke="#c00" stroke-width="2" marker-end="url(#r)"/>
  <text x="20" y="112" fill="#c00" font-weight="bold">Stackpointer</text>
  <text x="20" y="140" fill="#c00" font-size="12">zeigt auf das</text>
  <text x="20" y="156" fill="#c00" font-size="12">Ende des Stacks</text>
  <!-- right annotations -->
  <path d="M355,40 h10 v280 h-10" fill="none" stroke="#777"/>
  <text x="372" y="270" fill="#555" font-size="12">ATmega328P:</text>
  <text x="372" y="286" fill="#555" font-size="12">SRAM (2 KByte)</text>
  <path d="M355,330 h10 v80 h-10" fill="none" stroke="#777"/>
  <text x="372" y="366" fill="#555" font-size="12">ATmega328P:</text>
  <text x="372" y="382" fill="#555" font-size="12">Flash (32 KByte)</text>
